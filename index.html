            <li><b>Parejas con tablets.</b> Uno controla y el otro decide; cambian de rol con cada enemigo. Pida que lean la explicación en voz alta cuando pierdan un corazón.</li>
            <li><b>Estaciones.</b> Cuatro estaciones, una por combate (Choose a battle). Los grupos rotan cada 8 minutos.</li>
            <li><b>Tarea y cierre.</b> El alumno juega en casa, saca una foto del Battle Report y la trae. En la clase siguiente usa <b>Practise my mistakes</b> o usted agrupa por la barra más baja del reporte.</li>
          </ol>
          <h2 id="g-content">Contenido</h2>
          <h3>Vocabulario: espectáculos</h3>
          <div class="tbl-wrap"><table><thead><tr><th>Palabra</th><th>Definición usada en el juego</th></tr></thead><tbody>${voc(VOCAB.shows)}</tbody></table></div>
          <h3>Vocabulario: géneros musicales</h3>
          <div class="tbl-wrap"><table><thead><tr><th>Palabra</th><th>Definición usada en el juego</th></tr></thead><tbody>${voc(VOCAB.music)}</tbody></table></div>
          <h3>Verbos regulares (15)</h3>
          <div class="tbl-wrap"><table><thead><tr><th>Verbo</th><th>Participio</th><th>Regla</th></tr></thead><tbody>${reg}</tbody></table></div>
          <p>Reglas de ortografía que el juego explica: terminado en -e → +d (<span class="ex">liked</span>); consonante + y → ied (<span class="ex">tried</span>), pero vocal + y → +ed (<span class="ex">played</span>); una vocal + una consonante → doble consonante (<span class="ex">stopped</span>); <i>learned</i> y <i>learnt</i> se aceptan ambos (inglés británico).</p>
          <h3>Verbos irregulares (16)</h3>
          <div class="tbl-wrap"><table><thead><tr><th>Verbo</th><th>Pasado</th><th>Participio</th></tr></thead><tbody>${irr}</tbody></table></div>
          <h3>Gramática</h3>
          <div class="tbl-wrap"><table>
            <thead><tr><th>Forma</th><th>Ejemplo</th></tr></thead>
            <tbody>
              <tr><td>Pregunta (I / you / we / they)</td><td><span class="ex">Have you ever been to a concert?</span></td></tr>
              <tr><td>Pregunta (he / she / it)</td><td><span class="ex">Has your sister ever seen a play?</span></td></tr>
              <tr><td>Respuestas cortas</td><td><span class="ex">Yes, I have. / No, I haven't.</span> · <span class="ex">Yes, he has. / No, he hasn't.</span></td></tr>
              <tr><td>Negativa con never</td><td><span class="ex">I've never eaten sushi.</span></td></tr>
              <tr><td>been vs gone</td><td><span class="ex">Sara has been to the circus</span> (fue y volvió) · <span class="ex">Tom has gone to the circus</span> (fue y sigue allá)</td></tr>
            </tbody></table></div>
          <h2 id="g-errors">Errores frecuentes que el juego detecta y explica</h2>
          <ul>
            <li>Pasado simple en vez de participio: <span class="err">Have you ever went…?</span> → <span class="ex">been</span>; <span class="err">has drank</span> → <span class="ex">drunk</span>.</li>
            <li>Regularizar irregulares: <span class="err">eated</span>, <span class="err">drinked</span>, <span class="err">writed</span>, <span class="err">runned</span>.</li>
            <li>Ortografía de regulares: <span class="err">stoped</span>, <span class="err">tryed</span>, <span class="err">plaied</span>, <span class="err">startted</span>.</li>
            <li>Has / have con sujetos plurales: <span class="err">Has your parents…?</span> y con <i>you</i>: <span class="err">Has you…?</span></li>
            <li>Contracción en respuesta corta afirmativa: <span class="err">Yes, I've.</span> → <span class="ex">Yes, I have.</span></li>
            <li>Doble negación: <span class="err">No, he hasn't never.</span>; <i>ever</i> en negativas en vez de <i>never</i>.</li>
            <li>Vocabulario que se confunde: <i>opera</i> vs <i>soap opera</i>; <i>concert</i> vs <i>comedy</i> vs <i>cartoon</i> (escucha).</li>
            <li><i>read</i>: misma escritura en las tres formas, pero el participio se pronuncia /red/ (pregunta de escucha en el combate 2).</li>
          </ul>
          <p>En las preguntas de escritura no se acepta faltas de ortografía en el participio, porque es justamente lo que se practica. Sí se aceptan mayúsculas o minúsculas, puntos finales y contracciones sin apóstrofo (<i>havent</i>, <i>Ive</i>).</p>
          <h2 id="g-audio">Audio (Listening)</h2>
          <ul>
            <li>El audio usa la voz en inglés del propio dispositivo; se prefiere acento británico si está instalado. <b>Listen</b> se puede presionar las veces que se quiera y <b>Slow</b> lo lee más lento. En los diálogos, la segunda persona tiene otra voz o un tono distinto.</li>
            <li>En iPad o iPhone, quite el modo silencio y suba el volumen.</li>
            <li>Si un dispositivo no tiene voz, aparece el botón <b>Show the words</b>: usted puede leer el texto en voz alta o dejar que el alumno lo lea (se convierte en lectura).</li>
            <li>Después de responder, el texto escuchado aparece en la retroalimentación.</li>
          </ul>
          <h2>Accesibilidad</h2>
          <ul>
            <li>Botones de 64 px o más, texto grande y alto contraste en las tarjetas de preguntas.</li>
            <li>Teclado: 1–4 para elegir, Enter para enviar y continuar, P para pausar, L para escuchar.</li>
            <li>Si el dispositivo pide reducir el movimiento, las animaciones se desactivan.</li>
            <li>Las instrucciones del tutorial tienen apoyo breve en español.</li>
          </ul>
        </div>
        <div class="actions"><button class="btn primary" id="guideGo" type="button">${ICON.play} Volver al juego</button></div>
      </div>`;
    $('#guideBack').onclick = () => show('scr-title');
    $('#guideGo').onclick = () => show('scr-title');
    $$('.toc a').forEach((a) => a.onclick = (e) => { e.preventDefault(); const t = document.getElementById(a.getAttribute('href').slice(1)); if (t) t.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'start' }); });
  }

  /* ---------------- Overlay ---------------- */
  function openOverlay(html, cls) {
    const ov = $('#overlay');
    ov.innerHTML = `<div class="ov-card ${cls || ''}"><div class="burst-bg"></div>${html}</div>`;
    ov.hidden = false;
    autoFocus(ov.querySelector('[data-focus]') || ov.querySelector('button'));
    return ov;
  }
  function closeOverlay() { const ov = $('#overlay'); ov.hidden = true; ov.innerHTML = ''; }
  function banner(o) {
    const ov = openOverlay(`
      <div class="ov-kicker">${esc(o.kicker || '')}</div>
      <h2 id="ov-title" class="ov-title display outline-text">${esc(o.title)}</h2>
      ${o.art ? `<div class="ov-art" ${o.artStyle ? `style="${o.artStyle}"` : ''}>${o.art}</div>` : ''}
      ${o.body ? `<p class="ov-body">${o.body}</p>` : ''}
      ${o.stats ? `<div class="ov-stats">${o.stats.map((s) => `<span>${s}</span>`).join('')}</div>` : ''}
      <div class="ov-btns">${o.buttons.map((b, i) => `<button class="btn ${b.cls || ''}" type="button" data-b="${i}" ${i === 0 ? 'data-focus' : ''}>${b.label}</button>`).join('')}</div>`, o.cls);
    o.buttons.forEach((b, i) => { ov.querySelector(`[data-b="${i}"]`).onclick = () => { Sfx.click(); b.fn(); }; });
  }

  /* ---------------- Game flow ---------------- */
  function startAdventure() {
    S.run = 'adventure'; S.score = 0; S.log = []; S.cleared = []; S.fixed = new Set(); S.bestStreak = 0;
    startBattle(0);
  }
  function startSingle(li) {
    S.run = 'single'; S.score = 0; S.log = []; S.cleared = []; S.fixed = new Set(); S.bestStreak = 0;
    startBattle(li);
  }
  function makeDeck(lv) {
    const items = QUESTIONS.filter((q) => q.lv === lv.n);
    const pools = { r: shuffle(items.filter((q) => q.sk === 'r')), l: shuffle(items.filter((q) => q.sk === 'l')), w: shuffle(items.filter((q) => q.sk === 'w')) };
    return { items, pools, order: [] };
  }
  function draw() {
    if (S.mode === 'dojo') return S.dojo.queue.shift();
    const d = S.deck; let sk;
    if (S.level.boss) sk = S.level.phases[S.phase].sk;
    else { if (!d.order.length) d.order = shuffle(['r', 'l', 'w']); sk = d.order.shift(); }
    if (!d.pools[sk].length) {
      const last = S.q && S.q.id;
      d.pools[sk] = shuffle(d.items.filter((q) => q.sk === sk && q.id !== last));
    }
    return d.pools[sk].shift();
  }

  function startBattle(i) {
    closeOverlay();
    S.mode = 'battle'; S.li = i; S.level = LEVELS[i]; S.hp = S.level.hp; S.hearts = 3; S.streak = 0; S.phase = 0; S.qNum = 0;
    S.startScore = S.score; S.deck = makeDeck(S.level); S.q = null;
    setupArena(); show('scr-battle'); $('#qcard').innerHTML = '';
    const lv = S.level;
    const where = S.run === 'adventure' ? `Battle ${lv.n} of ${LEVELS.length}` : 'Single battle';
    if (lv.boss) {
      banner({ cls: 'ko', kicker: `Warning · Boss battle · ${where}`, title: lv.name, art: ART.ENEMY.dragon(),
        body: `${esc(lv.intro)}<br>Energy <b>${lv.hp}</b>`,
        stats: lv.phases.map((p, k) => `${k + 1}. ${p.name}: ${p.line.split(' ')[0]}`),
        buttons: [{ label: `${ICON.bolt} Fight!`, cls: 'primary', fn: () => { closeOverlay(); nextQuestion(); } }] });
    } else {
      banner({ kicker: where, title: lv.name, art: ART.ENEMY[lv.key](),
        body: `${esc(lv.intro)}<br>Energy <b>${lv.hp}</b> · ${esc(lv.topic)}`,
        buttons: [{ label: `${ICON.bolt} Fight!`, cls: 'primary', fn: () => { closeOverlay(); nextQuestion(); } }] });
    }
  }

  function startDojo() {
    const ids = new Set(); const list = [];
    S.log.forEach((e) => { if (!e.ok && !ids.has(e.id) && !S.fixed.has(e.id)) { ids.add(e.id); list.push(e.q); } });
    if (!list.length) return;
    S.mode = 'dojo'; S.dojo = { queue: shuffle(list), attempts: {}, total: list.length, fixedNow: 0 };
    S.level = { n: 0, key: 'lantern', name: 'Training Lantern', hp: list.length * 100, scene: 'dojo' };
    S.hp = S.level.hp; S.hearts = 3; S.streak = 0; S.qNum = 0; S.q = null;
    setupArena(); show('scr-battle'); $('#qcard').innerHTML = '';
    banner({ kicker: 'Training dojo', title: 'Practise your mistakes', art: ART.ENEMY.lantern(),
      body: `${list.length} question${list.length > 1 ? 's' : ''} from your report. No hearts are lost here. If you miss a question, it comes back later.`,
      buttons: [{ label: `${ICON.play} Start training`, cls: 'primary', fn: () => { closeOverlay(); nextQuestion(); } }] });
  }

  function setupArena() {
    const lv = S.level; const a = $('#arena');
    a.dataset.scene = lv.scene; a.dataset.phase = String(S.phase);
    $('#scene').innerHTML = ART.scene(lv.scene);
    const en = $('#enemy'); en.className = 'enemy' + (lv.key === 'dragon' ? ' dragon' : ''); en.innerHTML = ART.ENEMY[lv.key]();
    $('#heroSprite').innerHTML = ART.hero(hero()); $('#heroSprite').className = 'hero-sprite';
    $('#hudPortrait').innerHTML = ART.hero(hero(), { face: true });
    $('#hudName').textContent = heroName();
    $('#ename').textContent = lv.name;
    if (!$('#petals').children.length && !reduced()) {
      let p = ''; for (let i = 0; i < 12; i++) p += `<i style="left:${(i * 37) % 100}%;animation-duration:${6 + (i % 5) * 1.6}s;animation-delay:${-(i * 1.3)}s"></i>`;
      $('#petals').innerHTML = p;
    }
    $('#btnPause').innerHTML = ICON.pause;
    updateHUD();
  }

  function phaseLabel() {
    const lv = S.level;
    if (S.mode === 'dojo') return 'Training';
    if (lv.boss) return `Phase ${S.phase + 1} · ${lv.phases[S.phase].name}`;
    return S.run === 'adventure' ? `Battle ${lv.n} of ${LEVELS.length}` : 'Single battle';
  }

  function updateHUD() {
    const lv = S.level; if (!lv) return;
    const h = $('#hearts');
    if (S.mode === 'dojo') { h.innerHTML = '<span class="train-tag">Training mode</span>'; h.setAttribute('aria-label', 'Training mode, no hearts lost'); }
    else {
      h.innerHTML = [0, 1, 2].map((i) => i < S.hearts ? ICON.heart : ICON.heartBroken.replace('class="ico"', 'class="ico lost"')).join('');
      h.setAttribute('aria-label', `Hearts: ${S.hearts} of 3`);
    }
    $('#score').textContent = S.mode === 'dojo' ? '—' : S.score;
    const frac = Math.max(0, S.hp) / lv.hp;
    const fill = $('#hpfill'); fill.style.width = (frac * 100) + '%';
    fill.className = 'hpfill' + (frac <= 0.25 ? ' low' : frac <= 0.5 ? ' mid' : '');
    $('#hptext').textContent = `ENERGY ${Math.max(0, S.hp)} / ${lv.hp}`;
    const hb = $('#hpbar'); hb.setAttribute('aria-valuemax', lv.hp); hb.setAttribute('aria-valuenow', Math.max(0, S.hp));
    $('#ephase').textContent = phaseLabel();
    // journey
    const tr = $('#jtrack'); let prog = 0; let nodes = '';
    if (S.mode === 'dojo') { prog = S.dojo.total ? (S.dojo.fixedNow / S.dojo.total) : 0; }
    else if (S.run === 'adventure') {
      prog = (S.li + (1 - frac)) / LEVELS.length;
      nodes = LEVELS.map((L, i) => `<span class="jnode ${S.cleared.includes(L.n) ? 'done' : i === S.li ? 'now' : ''}" style="left:${((i + 1) / LEVELS.length) * 100}%" aria-hidden="true">${L.boss ? '★' : L.n}</span>`).join('');
    } else { prog = 1 - frac; nodes = `<span class="jnode ${S.hp <= 0 ? 'done' : 'now'}" style="left:100%" aria-hidden="true">${lv.boss ? '★' : lv.n}</span>`; }
    tr.innerHTML = `<div class="jfill" style="width:${Math.round(prog * 100)}%"></div>${nodes}`;
    tr.setAttribute('aria-valuenow', Math.round(prog * 100));
  }

  /* ---------------- Questions ---------------- */
  function nextQuestion() {
    Speech.stop();
    const q = draw();
    if (!q) { if (S.mode === 'dojo') return dojoDone(); return; }
    S.q = q; S.answered = false; S.qNum++; S.listened = false; S.built = [];
    renderQ();
  }

  function shortOpts(list) { return list.every((o) => o.text.length <= 22); }

  function renderQ() {
    const q = S.q; const c = $('#qcard');
    const ico = { r: ICON.book, l: ICON.ear, w: ICON.pencil }[q.sk];
    let h = `<div class="qmeta"><span class="chip ${q.sk}">${ico} ${SKILL[q.sk]}</span><span class="chip topic">${esc(FOCUS[q.fo])}</span>${S.streak >= 2 ? `<span class="streak">${ICON.bolt} Streak ${S.streak}</span>` : ''}<span class="qcount">Q${S.qNum}</span></div>`;
    if (q.sk === 'l') {
      if (q.who) h += `<p class="qwho">${esc(q.who)}</p>`;
      h += `<h2 class="qprompt" id="qprompt">${fmt(q.p)}</h2>`;
      h += `<div class="listen-row"><button class="btn listen" type="button" id="btnListen">${ICON.play} Listen</button><button class="btn" type="button" id="btnSlow">${ICON.slow} Slow</button></div><div id="tsWrap"></div>`;
    } else {
      if (q.pas) h += `<div class="passage">${fmt(q.pas)}</div>`;
      h += `<h2 class="qprompt" id="qprompt">${fmt(q.p)}</h2>`;
    }
    if (q.s) h += `<div class="qsentence">${fmt(q.s).replace(/_{3,}/g, '<span class="gap" aria-label="blank"></span>')}</div>`;

    if (q.t === 'mc' || q.t === 'tf') {
      if (q.t === 'tf') S.opts = [{ text: 'True', correct: q.a === true, why: q.why }, { text: 'False', correct: q.a === false, why: q.why }];
      else S.opts = shuffle(q.o.map((o, i) => ({ text: Array.isArray(o) ? o[0] : o, why: Array.isArray(o) ? o[1] : '', correct: i === 0 })));
      const two = q.t === 'tf' || shortOpts(S.opts);
      h += `<div class="opts ${two ? 'two' : ''} ${q.t === 'tf' ? 'tf' : ''}" role="group" aria-labelledby="qprompt">${S.opts.map((o, i) => `<button class="opt" type="button" data-i="${i}"><span class="k">${i + 1}</span><span class="t">${esc(o.text)}</span></button>`).join('')}</div>`;
    } else if (q.t === 'type') {
      h += `<div class="type-row ${q.long ? '' : 'short'}"><label class="sr" for="ansIn">Your answer</label><input id="ansIn" class="ans-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" placeholder="${q.long ? 'Write the full sentence here' : 'Type here'}"><button class="btn attack" type="button" id="btnAttack">${ICON.bolt} Attack!</button></div>`;
    } else if (q.t === 'build') {
      const words = q.ans.split(' '); const punct = /^[.?!]$/.test(words[words.length - 1]) ? words.pop() : '';
      S.buildAns = words; S.buildPunct = punct;
      S.tiles = shuffle(words.concat(q.ex || [])).map((w, i) => ({ w, i, used: false }));
      h += `<div class="buildline" id="buildLine" aria-live="polite"></div><div class="tiles" id="tiles" role="group" aria-label="Words">${S.tiles.map((t, i) => `<button class="tile" type="button" data-t="${i}">${esc(t.w)}</button>`).join('')}</div>
        <div class="build-actions"><button class="btn small" type="button" id="btnUndo">${ICON.back} Undo</button><button class="btn small" type="button" id="btnClear">Clear</button><button class="btn attack" type="button" id="btnBuild">${ICON.bolt} Attack!</button></div>`;
    }
    c.innerHTML = h;
    $('#cardCol').scrollTop = 0;

    if (q.sk === 'l') {
      $('#btnListen').onclick = () => listen(false);
      $('#btnSlow').onclick = () => listen(true);
      if (!Speech.ok) showTranscriptOption(true);
    }
    if (q.t === 'mc' || q.t === 'tf') { $$('.opt', c).forEach((b) => b.onclick = () => chooseOpt(+b.dataset.i)); }
    if (q.t === 'type') {
      const inp = $('#ansIn');
      $('#btnAttack').onclick = submitType;
      inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); submitType(); } });
    }
    if (q.t === 'build') {
      $$('.tile', c).forEach((b) => b.onclick = () => tapTile(+b.dataset.t));
      $('#btnUndo').onclick = undoTile; $('#btnClear').onclick = clearTiles; $('#btnBuild').onclick = submitBuild;
      drawBuild();
    }
    // focus
    const first = q.sk === 'l' ? $('#btnListen') : q.t === 'type' ? $('#ansIn') : q.t === 'build' ? $('.tile', c) : $('.opt', c);
    autoFocus(first, q.t === 'type' && q.sk !== 'l');
  }

  function listen(slow) {
    const q = S.q; if (!q || q.sk !== 'l') return;
    Sfx.init();
    const b = $(slow ? '#btnSlow' : '#btnListen');
    const okd = Speech.speak(q.au, slow, () => { if (b) b.classList.remove('playing'); });
    if (okd && b) b.classList.add('playing');
    if (!S.listened) { S.listened = true; showTranscriptOption(!okd); }
    if (!okd) showTranscriptOption(true);
    const lb = $('#btnListen'); if (lb && !slow) lb.innerHTML = `${ICON.replay} Listen again`;
  }
  function transcriptHTML(q) { const a = Array.isArray(q.au) ? q.au : [q.au]; return a.map((t) => (a.length > 1 ? '— ' : '') + esc(t)).join('<br>'); }
  function showTranscriptOption(noSound) {
    const w = $('#tsWrap'); if (!w || S.answered || w.dataset.shown) return;
    w.innerHTML = `${noSound ? '<p class="nosound">Sound is not working on this device. Ask your teacher to read it, or read it yourself.</p>' : ''}<button class="linkish" type="button" id="btnTs">Can't hear it? Show the words</button>`;
    $('#btnTs').onclick = () => { w.dataset.shown = '1'; w.innerHTML = `<div class="transcript">${transcriptHTML(S.q)}</div>`; };
  }

  function chooseOpt(i) {
    if (S.answered) return; const o = S.opts[i]; if (!o) return;
    $$('#qcard .opt').forEach((b, j) => {
      b.disabled = true; const oj = S.opts[j];
      if (oj.correct) { b.classList.add('ok'); b.querySelector('.k').innerHTML = ICON.check; }
      else if (j === i) { b.classList.add('no'); b.querySelector('.k').innerHTML = ICON.cross; }
      else b.classList.add('dim');
    });
    resolve(o.correct, o.text, o.correct ? '' : o.why, S.opts.find((x) => x.correct).text);
  }

  function norm(s) {
    s = String(s || '').toLowerCase().replace(/[’‘`´]/g, "'");
    s = s.replace(/\b(i|you|we|they)'ve\b/g, '$1 have').replace(/\b(he|she|it)'s\b/g, '$1 has')
      .replace(/\bhaven'?t\b/g, 'have not').replace(/\bhasn'?t\b/g, 'has not')
      .replace(/\bive\b/g, 'i have').replace(/\b(you|we|they)ve\b/g, '$1 have');
    return s.replace(/[^a-z0-9' ]+/g, ' ').replace(/'/g, '').replace(/\s+/g, ' ').trim();
  }
  function submitType() {
    if (S.answered) return; const q = S.q; const inp = $('#ansIn'); const raw = inp.value;
    if (!raw.trim()) { inp.focus(); inp.placeholder = 'Write your answer first'; return; }
    const light = raw.trim().toLowerCase().replace(/[’‘`´]/g, "'").replace(/[.!?]+$/, '').trim();
    const n = norm(raw);
    let ok = q.acc.some((a) => norm(a) === n); let why = '';
    if (ok && /\b(i|you|we|they|he|she|it)'(ve|s)$/.test(light) && /^yes\b/.test(light)) { ok = false; why = 'Don\'t use contractions in short yes answers: **Yes, I have.**'; }
    if (!ok && !why && q.bad) { for (const k in q.bad) { if (k === light || norm(k) === n) { why = q.bad[k]; break; } } }
    if (!ok && !why && q.pat) { for (const p of q.pat) { if (new RegExp(p[0]).test(n)) { why = p[1]; break; } } }
    if (!ok && !why && q.acc.some((a) => norm(a).replace(/ /g, '') === n.replace(/ /g, ''))) why = 'Check the spaces between the words.';
    if (!ok && !why) why = 'Compare your answer with the correct answer below, letter by letter.';
    inp.disabled = true; inp.classList.add(ok ? 'ok' : 'no'); $('#btnAttack').disabled = true;
    resolve(ok, raw.trim(), why, q.show || q.acc[0]);
  }

  function drawBuild() {
    const line = $('#buildLine'); if (!line) return;
    if (!S.built.length) line.innerHTML = '<span class="hint">Tap the words in the right order.</span>';
    else line.innerHTML = S.built.map((ti, k) => `<button class="tile placed" type="button" data-b="${k}">${esc(S.tiles[ti].w)}</button>`).join('') + (S.buildPunct ? `<span class="punct">${S.buildPunct}</span>` : '');
    $$('#buildLine .tile').forEach((b) => b.onclick = () => { if (S.answered) return; const k = +b.dataset.b; const ti = S.built.splice(k, 1)[0]; S.tiles[ti].used = false; syncTiles(); });
  }
  function syncTiles() { $$('#tiles .tile').forEach((b) => { b.classList.toggle('used', S.tiles[+b.dataset.t].used); }); drawBuild(); }
  function tapTile(ti) { if (S.answered) return; const t = S.tiles[ti]; if (!t || t.used) return; t.used = true; S.built.push(ti); Sfx.click(); syncTiles(); }
  function undoTile() { if (S.answered || !S.built.length) return; const ti = S.built.pop(); S.tiles[ti].used = false; syncTiles(); }
  function clearTiles() { if (S.answered) return; S.built.forEach((ti) => { S.tiles[ti].used = false; }); S.built = []; syncTiles(); }
  function submitBuild() {
    if (S.answered) return; const q = S.q;
    if (!S.built.length) { $('#buildLine').innerHTML = '<span class="hint">Tap the words first.</span>'; return; }
    const words = S.built.map((ti) => S.tiles[ti].w); const ans = S.buildAns;
    const ok = words.join(' ') === ans.join(' ');
    let why = '';
    if (!ok) {
      const extra = words.find((w) => (q.ex || []).includes(w) && !ans.includes(w));
      if (extra && q.exWhy && q.exWhy[extra]) why = q.exWhy[extra];
      else if (words.length < ans.length) why = 'Some words are missing. Use all the words you need.';
      else if (words.slice().sort().join(' ') === ans.slice().sort().join(' ')) why = 'Right words, wrong order. Remember: **Have / Has + person + ever + past participle**.';
      else why = 'Check the words and the order.';
    }
    $('#buildLine').classList.add(ok ? 'ok' : 'no');
    $$('#qcard .tile, #btnUndo, #btnClear, #btnBuild').forEach((b) => { b.disabled = true; });
    resolve(ok, words.join(' ') + (S.buildPunct || ''), why, ans.join(' ') + (S.buildPunct || ''));
  }

  /* ---------------- Resolve answer ---------------- */
  function resolve(ok, given, why, correct) {
    S.answered = true; const q = S.q;
    const entry = { id: q.id, q, ok, given, lv: S.level.n };
    if (S.mode !== 'dojo') S.log.push(entry);
    let head = ''; let heal = false;
    if (ok) {
      S.streak++; S.bestStreak = Math.max(S.bestStreak, S.streak);
      const special = S.mode !== 'dojo' && S.streak >= 3;
      const dmg = special ? 150 : 100;
      S.hp = Math.max(0, S.hp - dmg);
      if (S.mode !== 'dojo') S.score += 100 + (special ? 50 : 0);
      else { S.fixed.add(q.id); S.dojo.fixedNow++; }
      if (S.mode !== 'dojo' && S.streak % 5 === 0 && S.hearts < 3) { S.hearts++; heal = true; }
      fxHit(dmg, special, heal);
      head = special ? `${ICON.star} SPECIAL MOVE! −${dmg} energy` : `${ICON.check} HIT! −${dmg} energy`;
      if (heal) head += ' · Heart +1';
    } else {
      S.streak = 0;
      if (S.mode !== 'dojo') S.hearts = Math.max(0, S.hearts - 1);
      else { S.dojo.attempts[q.id] = (S.dojo.attempts[q.id] || 0) + 1; if (S.dojo.attempts[q.id] < 3) S.dojo.queue.push(q); }
      fxMiss();
      head = S.mode === 'dojo' ? `${ICON.cross} Not yet! It will come back.` : `${ICON.cross} OUCH! You lost a heart.`;
    }
    updateHUD();
    let nextLabel = 'Next question ▶';
    if (S.mode === 'dojo') { if (!S.dojo.queue.length) nextLabel = 'Finish training ▶'; }
    else if (S.hp <= 0) nextLabel = 'Victory! ▶';
    else if (S.hearts <= 0) nextLabel = 'Continue ▶';
    const fb = document.createElement('div');
    fb.className = 'fb ' + (ok ? 'ok' : 'no');
    fb.innerHTML = `<div class="fb-head">${head}</div><div class="fb-body">
      ${!ok && why ? `<p class="fb-why">${fmt(why)}</p>` : ''}
      ${!ok ? `<p class="fb-ans">Correct answer: <b>${esc(correct)}</b></p>` : ''}
      ${q.sk === 'l' ? `<p class="fb-said"><strong>You heard:</strong><br>${transcriptHTML(q)}</p>` : ''}
      <p class="fb-rule"><span class="tag">Rule</span><span>${fmt(q.rule)}</span></p>
      <button class="btn primary" type="button" id="btnNext">${nextLabel}</button></div>`;
    $('#qcard').appendChild(fb);
    const tsw = $('#tsWrap'); if (tsw && !tsw.dataset.shown) tsw.innerHTML = '';
    $('#live').textContent = plain(head.replace(/<[^>]+>/g, '')) + (ok ? '' : '. Correct answer: ' + correct);
    const nb = $('#btnNext');
    nb.onclick = () => { nb.disabled = true; onNext(); };
    autoFocus(nb);
    setTimeout(() => { fb.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'nearest' }); }, 90);
  }

  function onNext() {
    if (S.mode === 'dojo') { if (!S.dojo.queue.length) return dojoDone(); return nextQuestion(); }
    if (S.hp <= 0) return battleWon();
    if (S.hearts <= 0) return knockOut();
    if (S.level.boss) {
      const m = S.level.hp; const ph = S.hp > m * 2 / 3 ? 0 : S.hp > m / 3 ? 1 : 2;
      if (ph > S.phase) { S.phase = ph; return phaseBanner(); }
    }
    nextQuestion();
  }

  function phaseBanner() {
    const p = S.level.phases[S.phase];
    const vars = S.phase === 1 ? '--d1:#7B45E8;--d1s:#4C25A6;--d1l:#B596FF;--d2:#FF6FB0;--d3:#FFE14D' : '--d1:#F2A51A;--d1s:#A86A00;--d1l:#FFE08A;--d2:#2EE6FF;--d3:#FF3355';
    Sfx.ko();
    banner({ cls: 'ko', kicker: 'Warning!', title: `Phase ${S.phase + 1}: ${p.name}`, art: ART.ENEMY.dragon(), artStyle: vars,
      body: `The Encore Dragon changes form! Now: <b>${esc(p.line.toLowerCase())}</b>.`,
      buttons: [{ label: `${ICON.bolt} Keep fighting!`, cls: 'primary', fn: () => { closeOverlay(); $('#arena').dataset.phase = String(S.phase); updateHUD(); nextQuestion(); } }] });
  }

  function battleWon() {
    const lv = S.level; $('#enemy').classList.add('defeated'); Sfx.win();
    if (!S.cleared.includes(lv.n)) S.cleared.push(lv.n);
    const bonus = S.hearts * 100 + (lv.boss ? 500 : 0); S.score += bonus; updateHUD();
    const last = S.run === 'single' || S.li >= LEVELS.length - 1;
    const stats = [`Hearts left: ${S.hearts}`, `Bonus +${bonus}`, `Score ${S.score}`];
    setTimeout(() => banner({ cls: 'win', kicker: lv.boss ? 'Boss defeated!' : 'Stage clear!', title: `${lv.name} defeated!`,
      art: ART.hero(hero()), body: last ? (lv.boss && S.run === 'adventure' ? `Amazing, ${esc(heroName())}! You saved the show!` : `Well done, ${esc(heroName())}!`) : `Next enemy: <b>${esc(LEVELS[S.li + 1].name)}</b> · Energy ${LEVELS[S.li + 1].hp}`,
      stats,
      buttons: last ? [{ label: 'See my Battle Report', cls: 'primary', fn: showReport }]
        : [{ label: 'Next battle ▶', cls: 'primary', fn: () => startBattle(S.li + 1) }, { label: 'See my report so far', fn: showReport }] }), reduced() ? 50 : 750);
  }

  function knockOut() {
    Sfx.ko();
    banner({ cls: 'ko', kicker: 'K.O.', title: "Don't give up!", art: ART.ENEMY[S.level.key](),
      body: 'You lost all your hearts. Try this battle again. The questions will be different!',
      buttons: [{ label: `${ICON.replay} Try again`, cls: 'primary', fn: () => { S.score = S.startScore; startBattle(S.li); } },
        { label: 'See my Battle Report', fn: showReport }] });
  }

  function dojoDone() {
    Sfx.win(); $('#enemy').classList.add('defeated');
    const d = S.dojo;
    banner({ cls: 'win', kicker: 'Training complete', title: d.fixedNow === d.total ? 'All fixed!' : 'Good training!', art: ART.hero(hero()),
      body: `You fixed <b>${d.fixedNow}</b> of <b>${d.total}</b> mistake${d.total > 1 ? 's' : ''}.`,
      buttons: [{ label: 'Back to my report', cls: 'primary', fn: showReport },
        { label: `${ICON.replay} Play the adventure again`, fn: () => { S.pending = { run: 'adventure' }; startAdventure(); } },
        { label: 'Title screen', fn: () => { closeOverlay(); renderTitle(); show('scr-title'); } }] });
  }

  /* ---------------- FX ---------------- */
  function restart(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
  function fxHit(dmg, special, heal) {
    const fx = $('#fx'); const h = hero();
    restart($('#heroSprite'), 'lunge');
    setTimeout(() => restart($('#enemy'), 'hit'), reduced() ? 0 : 300);
    const b = document.createElement('div'); b.className = 'blast' + (special ? ' special' : ''); b.style.setProperty('--c', h.fx); fx.appendChild(b);
    const d = document.createElement('div'); d.className = 'dmg'; d.textContent = '−' + dmg; d.style.animationDelay = '.28s'; fx.appendChild(d);
    const p = document.createElement('div');
    p.className = 'pow' + (special ? ' special' : '');
    p.textContent = special ? 'SPECIAL MOVE!' : ['POW!', 'BAM!', 'HIT!', 'SMASH!', 'ZAP!'][Math.floor(Math.random() * 5)];
    if (special) { const s = document.createElement('div'); s.className = 'speedlines'; fx.appendChild(s); setTimeout(() => s.remove(), 700); }
    setTimeout(() => fx.appendChild(p), 250);
    setTimeout(() => { b.remove(); d.remove(); p.remove(); }, 1400);
    special ? Sfx.special() : Sfx.hit();
    if (heal) {
      setTimeout(() => { const hp = document.createElement('div'); hp.className = 'pow heal'; hp.textContent = 'HEART +1'; fx.appendChild(hp); Sfx.heal(); setTimeout(() => hp.remove(), 1000);
        const hs = $$('#hearts .ico'); if (hs[S.hearts - 1]) restart(hs[S.hearts - 1], 'pop'); }, 1100);
    }
  }
  function fxMiss() {
    restart($('#enemy'), 'attack');
    setTimeout(() => { restart($('#heroSprite'), 'hurt'); restart($('#arena'), 'hurt'); const hs = $$('#hearts .ico'); if (hs[S.hearts]) restart(hs[S.hearts], 'pop'); }, reduced() ? 0 : 220);
    Sfx.miss();
  }

  /* ---------------- Pause ---------------- */
  function openPause() {
    if ($('#scr-battle').hidden) return;
    Speech.stop(); S.quitArm = false;
    const ov = openOverlay(`
      <div class="ov-kicker">${esc(phaseLabel())}</div>
      <h2 id="ov-title" class="ov-title display outline-text">Paused</h2>
      <div class="pause-grid">
        <button class="btn primary" type="button" id="pResume" data-focus>${ICON.play} Resume</button>
        <button class="btn" type="button" id="pRestart">${ICON.replay} Restart this battle</button>
        <button class="btn" type="button" id="pHow">How to play</button>
        <button class="btn" type="button" id="pSound">${Sfx.on ? ICON.soundOn + ' Sound effects: on' : ICON.soundOff + ' Sound effects: off'}</button>
        ${S.mode === 'dojo' ? '' : `<button class="btn" type="button" id="pReport">End and see my report</button>`}
        <button class="btn ghost" type="button" id="pQuit">Quit to title screen</button>
      </div>`);
    $('#pResume', ov).onclick = closeOverlay;
    $('#pRestart', ov).onclick = () => { if (S.mode === 'dojo') { closeOverlay(); startDojo(); } else { S.score = S.startScore; startBattle(S.li); } };
    $('#pHow', ov).onclick = () => { closeOverlay(); S.returnTo = 'scr-battle'; renderHowto(); show('scr-howto'); };
    $('#pSound', ov).onclick = () => { toggleSound(); $('#pSound').innerHTML = Sfx.on ? ICON.soundOn + ' Sound effects: on' : ICON.soundOff + ' Sound effects: off'; };
    if ($('#pReport', ov)) $('#pReport', ov).onclick = showReport;
    $('#pQuit', ov).onclick = () => {
      if (!S.quitArm) { S.quitArm = true; $('#pQuit').textContent = 'Tap again to quit (progress is lost)'; return; }
      closeOverlay(); renderTitle(); show('scr-title');
    };
  }

  /* ---------------- Report ---------------- */
  function pct(c, t) { return t ? Math.round((c / t) * 100) : 0; }
  function barRow(label, c, t) {
    if (!t) return `<div class="bar-row none"><span>${esc(label)}</span><div class="bar"><i style="width:0"></i></div><b>—</b></div>`;
    const p = pct(c, t);
    return `<div class="bar-row"><span>${esc(label)}</span><div class="bar" role="img" aria-label="${esc(label)}: ${c} of ${t} correct"><i class="${p < 50 ? 'low' : p < 75 ? 'mid' : ''}" style="width:${p}%"></i></div><b>${p}%</b></div>`;
  }
  function questionSummary(q) {
    if (q.sk === 'l') return `${plain(q.p)} <span class="rule">(Audio: “${esc(Array.isArray(q.au) ? q.au.join(' / ') : q.au)}”)</span>`;
    let s = esc(plain(q.p));
    if (q.s) s += ` <span class="rule">${esc(plain(q.s).replace(/\n/g, ' '))}</span>`;
    else if (q.pas && q.pas.length < 90) s += ` <span class="rule">${esc(plain(q.pas).replace(/\n/g, ' '))}</span>`;
    return s;
  }
  function correctOf(q) {
    if (q.t === 'mc') return q.o[0];
    if (q.t === 'tf') return q.a ? 'True' : 'False';
    if (q.t === 'type') return q.show || q.acc[0];
    return q.ans.replace(/ ([.?!])$/, '$1');
  }
  function showReport() {
    closeOverlay(); Speech.stop();
    const log = S.log; const total = log.length; const right = log.filter((e) => e.ok).length; const acc = pct(right, total);
    const by = (key, val) => { const l = log.filter((e) => e.q[key] === val); return [l.filter((e) => e.ok).length, l.length]; };
    const battles = S.run === 'adventure' ? LEVELS.length : 1;
    const ranks = acc >= 90 ? ['S', 'Legend'] : acc >= 75 ? ['A', 'Hero'] : acc >= 60 ? ['B', 'Rising star'] : ['C', 'Rookie'];
    const best = store.get('best', 0); if (S.score > best) store.set('best', S.score);
    // mistakes
    const miss = new Map();
    log.forEach((e) => { if (!e.ok) miss.set(e.id, e); });
    const missList = [...miss.values()];
    const toPractise = missList.filter((e) => !S.fixed.has(e.id)).length;
    const missHTML = missList.length ? `<ul class="miss-list">${missList.map((e) => `<li class="miss">
        <div class="mtop"><span class="chip ${e.q.sk}">${SKILL[e.q.sk]}</span><span class="chip topic">${esc(FOCUS[e.q.fo])}</span>${S.fixed.has(e.id) ? `<span class="chip fixed">${ICON.check} Fixed in training</span>` : ''}</div>
        <div class="q">${questionSummary(e.q)}</div>
        <div class="you">You answered: ${esc(e.given)}</div>
        <div class="right">Correct: ${esc(correctOf(e.q))}</div>
        <div class="rule">${fmt(e.q.rule)}</div></li>`).join('')}</ul>`
      : `<p class="empty-good">${total ? 'No mistakes. Perfect battle!' : 'No answers yet. Play a battle to see your report.'}</p>`;
    $('#scr-report').innerHTML = `
      <div class="page">
        <div class="report-head">
          <div class="portrait">${ART.hero(hero(), { face: true })}</div>
          <div><div class="eyebrow">Battle Report · ${S.run === 'adventure' ? 'Adventure' : 'Single battle'}</div><h1 id="report-h" class="display">${esc(heroName())}</h1><p>${esc(hero().name)} · ${new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })}</p></div>
          <div class="rank" role="img" aria-label="Rank ${ranks[0]}, ${ranks[1]}"><div><b>${total ? ranks[0] : '?'}</b><small>${total ? ranks[1] : 'Play!'}</small></div></div>
        </div>
        <div class="stats">
          <div class="stat"><small>Score</small><b>${S.score}</b></div>
          <div class="stat"><small>Correct</small><b>${right}/${total}</b></div>
          <div class="stat"><small>Enemies defeated</small><b>${S.cleared.length}/${battles}</b></div>
          <div class="stat"><small>Best streak</small><b>${S.bestStreak}</b></div>
        </div>
        <div class="bars-grid">
          <div class="panel"><h2>Skills</h2>${barRow('Reading', ...by('sk', 'r'))}${barRow('Listening', ...by('sk', 'l'))}${barRow('Writing', ...by('sk', 'w'))}</div>
          <div class="panel"><h2>Topics</h2>${Object.keys(FOCUS).map((k) => barRow(FOCUS[k], ...by('fo', k))).join('')}</div>
        </div>
        <div class="panel"><h2>Mistakes to review (${missList.length})</h2><p>Read each rule. Then train only these questions.</p>${missHTML}</div>
        <div class="actions">
          <button class="btn primary" type="button" id="rDojo" data-focus ${toPractise ? '' : 'disabled'}>${ICON.bolt} Practise my mistakes only${toPractise ? ` (${toPractise})` : ''}</button>
          <button class="btn" type="button" id="rAgain">${ICON.replay} Play again</button>
          <button class="btn ghost" type="button" id="rTitle">Title screen</button>
        </div>
        <p class="best" style="text-align:center">Tip: take a photo of this report and show it to your teacher.</p>
      </div>`;
    show('scr-report');
    $('#rDojo').onclick = startDojo;
    $('#rAgain').onclick = () => { if (S.run === 'single') startSingle(S.li); else startAdventure(); };
    $('#rTitle').onclick = () => { renderTitle(); show('scr-title'); };
  }

  /* ---------------- Keyboard ---------------- */
  const typing = (e) => e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA');
  document.addEventListener('keydown', (e) => {
    const ovOpen = !$('#overlay').hidden;
    const inBattle = !$('#scr-battle').hidden;
    if (e.key === 'Escape' || ((e.key === 'p' || e.key === 'P') && !typing(e))) {
      if (!inBattle) return;
      if (ovOpen && $('#pResume')) { e.preventDefault(); closeOverlay(); return; }
      if (!ovOpen) { e.preventDefault(); openPause(); return; }
    }
    if (ovOpen || !inBattle || !S.q) return;
    if (S.answered) { if (e.key === 'Enter') { e.preventDefault(); const nb = $('#btnNext'); if (nb && !nb.disabled) nb.click(); } return; }
    if (typing(e)) return;
    const q = S.q; const k = parseInt(e.key, 10);
    if ((e.key === 'l' || e.key === 'L') && q.sk === 'l') { e.preventDefault(); listen(false); return; }
    if (q.t === 'mc' || q.t === 'tf') {
      if (k >= 1 && k <= S.opts.length) { e.preventDefault(); chooseOpt(k - 1); }
      else if (q.t === 'tf' && (e.key === 't' || e.key === 'T')) chooseOpt(0);
      else if (q.t === 'tf' && (e.key === 'f' || e.key === 'F')) chooseOpt(1);
    } else if (q.t === 'build') {
      if (k >= 1 && k <= 9) { const avail = S.tiles.map((t, i) => i).filter((i) => !S.tiles[i].used); if (avail[k - 1] != null) { e.preventDefault(); tapTile(avail[k - 1]); } }
      else if (e.key === 'Backspace') { e.preventDefault(); undoTile(); }
      else if (e.key === 'Enter' && document.activeElement && !document.activeElement.classList.contains('tile') && document.activeElement.tagName !== 'BUTTON') { e.preventDefault(); submitBuild(); }
    }
  });

  document.addEventListener('visibilitychange', () => { if (document.hidden) Speech.stop(); });
  /* ---------------- Init ---------------- */
  $('#btnPause').onclick = openPause;
  renderTitle(); renderGuide();
  show('scr-title');
})();

</script>

</body>
</html>
